[project]
name = "meret"
dynamic = ["version"]
description = "Tagged media file system with virtual folders"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    # Core
    "typer>=0.12.0",
    "rich>=15.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "platformdirs>=3.0",
    # All features now mandatory
    "fsspec>=2023.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "Textual>=8.2.0",
    # Platform-specific mount drivers (only install where needed)
    "fusepy>=1.0.0; sys_platform != 'win32'",
    "winfspy>=0.8.0; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "pytest-qt>=4.2", "black", "ruff", "mypy"]
gui = ["PySide6>=6.6.0"]

[project.scripts]
meret = "meret.cli.app:app"

[tool.hatch.version]
path = "meret/__init__.py"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # typer.Argument()/Option() in defaults is the documented Typer style, and _()
    # there has to run at import time so the help text is translated.
    "B008",
    # A deliberate mutable class attribute: Textual's BINDINGS and the extractor
    # registry's supported_extensions.
    "RUF012",
    # returncode is inspected by hand at every subprocess.run call.
    "PLW1510",
    # A worker or task boundary catches everything on purpose: one unreadable file
    # must not take the app down.
    "BLE001",
    # Best-effort flush()/stop() on a stream or a mount that may already be gone.
    "S110",
    # An unknown log level is a bad value, not a bad type - and the CLI turns the
    # ValueError into a BadParameter.
    "TRY004",
    # SourceFile keeps its handle open for the object's whole life and closes it in
    # close(); a `with` would defeat that.
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
# Tests: leftovers and the shape of pytest itself, not production code.
"tests/**" = ["B017", "F841", "RUF059", "SIM102"]

[tool.hatch.build.targets.wheel]
packages = ["meret"]
artifacts = ["meret/gui/icons/*.svg", "meret/gui/icons/LICENSE"]

[tool.hatch.build.targets.wheel.force-include]
"meret/core/schema.sql" = "meret/core/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

markers = [
    "integration: marks tests as integration tests (slow)",
    "slow: marks tests as slow",
]

[tool.babel.messages]
input_files = "meret/**/*.py"
output_file = "meret/locales/messages.pot"

[tool.setuptools.package-data]
meret = ["locales/**/*.mo", "locales/**/*.po"]