[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meret"
version = "0.1.0"
description = "Tagged media file system with virtual folders"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
meret = "meret.cli.app:app"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100