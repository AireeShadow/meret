[project]
name = "meret"
dynamic = ["version"]
description = "Tagged media file system with virtual folders"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    # Core
    "typer>=0.12.0",
    "rich>=15.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "platformdirs>=3.0",
    # All features now mandatory
    "fsspec>=2023.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "Textual>=8.2.0",
    # Platform-specific mount drivers (only install where needed)
    "fusepy>=1.0.0; sys_platform != 'win32'",
    "winfspy>=2.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "black", "ruff", "mypy", "pytest-qt>=4.2"]
gui = ["PySide6>=6.6.0"]

[project.scripts]
meret = "meret.cli.app:app"

[tool.hatch.version]
path = "meret/__init__.py"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["meret"]

[tool.hatch.build.targets.wheel.force-include]
"meret/core/schema.sql" = "meret/core/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

markers = [
    "integration: marks tests as integration tests (slow)",
    "slow: marks tests as slow",
]

[tool.babel.messages]
input_files = "meret/**/*.py"
output_file = "meret/locales/messages.pot"

[tool.setuptools.package-data]
meret = ["locales/**/*.mo", "locales/**/*.po"]