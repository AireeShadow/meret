[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meret"
dynamic = ["version"]                 # ← required: the version comes from meret/__init__.py
description = "Tagged media file system with virtual folders"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=15.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev        = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "black", "ruff", "mypy"]
vfs-fsspec = ["fsspec"]
vfs-fuse   = ["fusepy"]
vfs-win    = ["winfspy"]
config     = ["tomli>=2.0.0; python_version<'3.11'", "tomli-w>=1.0.0"]
tui        = ["Textual>=8.2.0"]

[project.scripts]
meret = "meret.cli.app:app"

[tool.hatch.version]
path = "meret/__init__.py"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["meret"]

[tool.hatch.build.targets.wheel.force-include]
"meret/core/schema.sql" = "meret/core/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

markers = [
    "integration: marks tests as integration tests (slow)",
    "slow: marks tests as slow",
]